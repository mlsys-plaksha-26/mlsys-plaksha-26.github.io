[project]
name = "qwen-decode-timing"
version = "0.1.0"
description = "Batch-one BF16 Qwen3 decode latency on a local NVIDIA GPU"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.7.1",
    "transformers==4.57.1",
    "accelerate>=1.6,<2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
